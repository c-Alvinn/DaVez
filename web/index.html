<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/icon-logo-davez.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DaVez | Logística Agrícola Inteligente</title>
  <!-- Fonts and Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #102218;
    }

    .loader-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      background: radial-gradient(circle at center, #1b4332 0%, #102218 100%);
    }

    .logo-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 4rem;
      /* Aumentado para melhor espaçamento */
    }

    .loader-ring {
      position: absolute;
      width: 120px;
      /* Aumentado levemente */
      height: 120px;
      border-radius: 50%;
      border: 4px solid rgba(19, 236, 109, 0.1);
      border-top-color: #13ec6d;
      animation: spin 1.5s cubic-bezier(0.5, 0, 0.5, 1) infinite;
    }

    .loader-logo {
      width: 60px;
      height: 60px;
      background-image: url('/logo-davez.png');
      background-size: cover;
      background-position: center;
      border-radius: 12px;
      /* Adicionado border radius conforme pedido */
      box-shadow: 0 0 20px rgba(19, 236, 109, 0.3);
      z-index: 2;
      animation: pulse 2s ease-in-out infinite;
    }

    .loader-text {
      font-family: 'Inter', sans-serif;
      font-weight: 800;
      font-size: 1.8rem;
      /* Aumentado levemente */
      letter-spacing: -0.05em;
      color: white;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(10px);
      animation: fadeIn 1s ease-out forwards;
      animation-delay: 0.5s;
    }

    .loader-text span {
      color: #13ec6d;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
        opacity: 0.8;
      }

      50% {
        transform: scale(1.5);
        opacity: 1;
      }
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }

      from {
        opacity: 0;
        transform: translateY(10px);
      }
    }
  </style>
</head>

<body>
  <div id="root">
    <div class="loader-container">
      <div class="logo-container">
        <div class="loader-ring"></div>
        <div class="loader-logo"></div>
      </div>
      <div class="loader-text">Da<span>Vez</span></div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
